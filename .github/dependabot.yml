version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
      day: "monday"
      time: "08:00"
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "monthly"
      day: "monday"
      time: "08:00"

  - package-ecosystem: "vcpkg"
    directory: "/"
    schedule:
      interval: "monthly"
      day: "monday"
      time: "08:00"
    groups:
      cpp-deps:
        patterns:
          - "*"