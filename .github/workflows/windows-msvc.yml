name: Windows (MSVC + vcpkg)

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      VCPKG_ROOT: C:\vcpkg
    steps:
      - uses: actions/checkout@v6

      - name: Cache vcpkg
        uses: actions/cache@v4
        with:
          path: |
            C:\vcpkg\installed
            C:\vcpkg\packages
            C:\vcpkg\buildtrees
          key: vcpkg-${{ hashFiles('vcpkg.json') }}

      - name: Restore vcpkg dependencies
        run: vcpkg install --triplet x64-windows --no-debug

      - name: Configure
        shell: pwsh
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release `
            "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_ROOT\scripts\buildsystems\vcpkg.cmake" `
            -DVHG_ASAN=ON

      - name: Build
        run: cmake --build build --config RelWithDebInfo --parallel

      - name: Test (excluding SCR1 integration)
        env:
          ASAN_OPTIONS: detect_leaks=1:detect_stack_use_after_return=1:check_initialization_order=1:strict_string_checks=1
        run: ctest --test-dir build -C RelWithDebInfo --output-on-failure -E scr1 --output-on-failure --parallel

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: verihogg-format-windows-x64
          # Multi-config (Visual Studio) generator puts artifacts in a
          # per-config subdirectory, hence the RelWithDebInfo segment.
          path: build/bin/RelWithDebInfo/verihogg-format.exe
          if-no-files-found: error
          retention-days: 7