name: macOS Build

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: macos-${{ runner.os }}

      - name: Install Homebrew dependencies
        run: |
          brew update > /dev/null 2>&1 || true
          brew install cli11 yaml-cpp valijson googletest

      - name: Build slang from source (not in Homebrew)
        timeout-minutes: 20
        run: |
          git clone --depth 1 --branch v10.0 \
            https://github.com/MikePopoloski/slang.git /tmp/slang-src
          cmake -S /tmp/slang-src -B /tmp/slang-build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_FLAGS="-DFMT_USE_STD_FORMAT=0" \
            -DCMAKE_INSTALL_PREFIX=$HOME/slang-install \
            -DSLANG_TESTS=OFF -DSLANG_BENCHMARKS=OFF -DBUILD_SHARED_LIBS=OFF \
            -DSLANG_USE_BOOST=OFF -DSLANG_INCLUDE_BOOST=OFF
          cmake --build /tmp/slang-build --parallel
          cmake --install /tmp/slang-build

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo \
          -DCMAKE_PREFIX_PATH=$HOME/slang-install -DVHG_ENABLE_CCACHE=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Test (excluding SCR1 integration)
        run: ctest --test-dir build --output-on-failure -E scr1